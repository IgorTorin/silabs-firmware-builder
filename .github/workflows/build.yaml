name: Build firmwares

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize containers
        run: echo "Initializing build containers..."

      - name: Install SDK extensions
        run: |
          echo "Installing Silicon Labs SDK components..."

      # Радикальное исправление прав Git для хоста и любых Docker-контейнеров
      - name: Fix Git safe directory globally and system-wide
        run: |
          sudo chown -R $(whoami) .
          git config --global --add safe.directory '*'
          sudo git config --system --add safe.directory '*'

      # Основной запуск компиляции с указанием манифеста
      - name: Build firmware
        run: python3 tools/build_project.py --manifest dsgw280.yaml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binaries
          path: artifacts/
