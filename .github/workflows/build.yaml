name: Build firmwares

on:
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'README.md'
  push:
    paths-ignore:
      - '.gitignore'
      - 'README.md'
  release:
    types:
      - published

env:
  REGISTRY: ghcr.io

jobs:
  run-pre-commit:
    name: Run pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Install pre-commit
        run: |
          pip install pre-commit
          pre-commit install
      - name: Run pre-commit
        run: |
          pre-commit run --show-diff-on-failure --color=always --all-files

  build-container:
    name: Create build container image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to the GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read repository information
        id: read-repo-info
        run: |
          if [[ $GITHUB_EVENT_NAME == "pull_request" ]]; then
            base_image=$(echo ${{ github.event.pull_request.base.repo.full_name }} | awk '{print tolower($0)}')
            head_image=$(echo ${{ github.event.pull_request.head.repo.full_name }} | awk '{print tolower($0)}')
          else
            base_image=$(echo ${{ github.repository }} | awk '{print tolower($0)}')
            head_image=$(echo ${{ github.repository }} | awk '{print tolower($0)}')
          fi

          tag_name=$(echo "${{ hashFiles('Dockerfile') }}" | cut -c-16)

          image_name=$head_image
          build_image=true

          if docker manifest inspect ${{ env.REGISTRY }}/$base_image:$tag_name; then
            image_name=$base_image
            build_image=false
          fi

          if [[ $base_image != $head_image ]]; then
            if docker manifest inspect ${{ env.REGISTRY }}/$head_image:$tag_name; then
              image_name=$head_image
              build_image=false
            fi
          fi

          if [[ $build_image == "true" && $GITHUB_EVENT_NAME == "pull_request" ]]; then
            echo "Cannot build a new container within a PR. Please re-run this action after $head_image:$tag_name is built."
            exit 1
          fi

          echo "build_image=$build_image" >> $GITHUB_OUTPUT
          echo "tag_name=$tag_name" >> $GITHUB_OUTPUT
          echo "image_name=$image_name" >> $GITHUB_OUTPUT
          echo "container_name=${{ env.REGISTRY }}/$image_name:$tag_name" >> $GITHUB_OUTPUT
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        if: steps.read-repo-info.outputs.build_image == 'true'
      - name: Build and Push
        uses: docker/build-push-action@v6
        if: steps.read-repo-info.outputs.build_image == 'true'
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.REGISTRY }}/${{ steps.read-repo-info.outputs.image_name }}:${{ steps.read-repo-info.outputs.tag_name }}
          cache-from: ${{ env.REGISTRY }}/${{ steps.read-repo-info.outputs.image_name }}:cache-${{ steps.read-repo-info.outputs.tag_name }}
          cache-to: ${{ env.REGISTRY }}/${{ steps.read-repo-info.outputs.image_name }}:cache-${{ steps.read-repo-info.outputs.tag_name }}
          push: true
    outputs:
      tag_name: ${{ steps.read-repo-info.outputs.tag_name }}
      image_name: ${{ steps.read-repo-info.outputs.image_name }}
      container_name: ${{ steps.read-repo-info.outputs.container_name }}

  build-firmwares:
    name: Firmware builder
    needs: [build-container]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build-container.outputs.container_name }}
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Настраиваем системные права для root внутри контейнера
      - name: Fix Git permissions for root user
        run: |
          chown -R root:root "$GITHUB_WORKSPACE"
          git config --global --add safe.directory '*'
          git config --system --add safe.directory '*'

      - name: Install SDK extensions
        run: |
          # XXX: slc-cli does not actually work when the extensions aren't in the SDK!
          for sdk in /*_sdk_*; do
            slc signature trust --sdk "$sdk"

            ln -s $PWD/gecko_sdk_extensions "$sdk"/extension

            for ext in "$sdk"/extension/*/; do
              slc signature trust --sdk "$sdk" --extension-path "$ext"
            done
          done

      - name: Build firmware
        id: build-firmware
        run: |
          # 2. Обновляем run_build.py: жестко передаем аргументы напрямую в класс манифеста устройства
          cat << 'EOF' > run_build.py
          import sys
          import glob
          from pathlib import Path

          # Подключаем папку с оригинальными инструментами
          sys.path.insert(0, str(Path(__file__).parent / "tools"))
          import build_project

          def run_fixed_build():
              # Сканируем реальные пути контейнера
              detected_sdks = glob.glob("/*_sdk*")
              sdks = [Path(s) for s in detected_sdks] if detected_sdks else [Path("/gecko_sdk")]
              
              detected_toolchains = glob.glob("/opt/*arm-none-eabi*")
              toolchains = [Path(t) for t in detected_toolchains] if detected_toolchains else [Path("/opt/gcc-arm-none-eabi")]
              
              print(f"=== [FIX] Found SDKs: {sdks} ===")
              print(f"=== [FIX] Found Toolchains: {toolchains} ===")
              
              # Загружаем ваш файл dsgw280.yaml
              manifest_path = Path("manifests/dsgw280.yaml")
              manifest = build_project.ArchitectureManifest.from_file(manifest_path)
              
              # Напрямую вызываем оригинальную функцию сборки прошивки Silicon Labs,
              # полностью минуя падающий метод main() и его парсер аргументов
              build_project.build_project(
                  manifest=manifest,
                  sdks=sdks,
                  toolchains=toolchains,
                  build_dir=Path("build"),
                  build_system="makefile",
                  output_dir=Path("outputs"),
                  outputs=["gbl", "hex", "out"],
                  postbuild=None,
                  overrides=None,
                  keep_slc_daemon=False
              )
              print("=== [FIX] Native Compilation Successfully Finished! ===")

          if __name__ == "__main__":
              run_fixed_build()
          EOF

          # 3. Запуск нашего чистого и безопасного стартера
          python3 run_build.py

          # Указываем имя артефакта для сохранения результатов
          output_basename=$(basename -- $(basename -- $(ls -1 outputs/*.gbl | head -n 1)) .gbl)
          echo "output_basename=$output_basename" >> $GITHUB_OUTPUT

      - name: Install node within container (act)
        if: ${{ env.ACT }}
        run: |
          curl -fsSL https://nodesource.com | bash -s 20
          apt-get install -y nodejs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-build-${{ steps.build-firmware.outputs.output_basename }}
          path: outputs/*
          compression-level: 9
          if-no-files-found: error

  release-assets:
    name: Upload release assets
    needs: [build-firmwares]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: firmware-build-*

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.gbl
